
<script>
const API = "https://api.openf1.org/v1";

const table = document.getElementById("timingTable");
const statusText = document.getElementById("liveStatus");
const sessionName = document.getElementById("sessionName");
const updatedAt = document.getElementById("updatedAt");
const refreshButton = document.getElementById("refreshButton");

const NORMAL_REFRESH_MS = 120000; // 2 минуты
const MAX_BACKOFF_MS = 900000;    // 15 минут

let busy = false;
let timer = null;
let failures = 0;
let retryNotBefore = 0;

function safe(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
}

async function api(path) {
    const response = await fetch(`${API}/${path}`);

    if (!response.ok) {
        const error = new Error(
            `OpenF1 вернул ошибку ${response.status}`
        );

        error.status = response.status;

        const retryAfter = Number(response.headers.get("Retry-After"));
        error.retryAfterMs = Number.isFinite(retryAfter) && retryAfter > 0
            ? retryAfter * 1000
            : 0;

        throw error;
    }

    return response.json();
}

function latestByDriver(records) {
    const result = new Map();

    for (const item of records || []) {
        const id = String(item.driver_number);
        const old = result.get(id);

        if (!old || String(item.date || "") > String(old.date || "")) {
            result.set(id, item);
        }
    }

    return result;
}

function timeString(value) {
    if (value === null || value === undefined || value === "") {
        return "—";
    }

    const seconds = Number(value);

    if (!Number.isFinite(seconds)) {
        return String(value);
    }

    const minutes = Math.floor(seconds / 60);
    const remainder = (seconds % 60).toFixed(3).padStart(6, "0");

    return minutes > 0
        ? `${minutes}:${remainder}`
        : remainder;
}

function gapString(value) {
    if (value === null || value === undefined || value === "") {
        return "—";
    }

    if (typeof value === "string" && value.includes("LAP")) {
        return value;
    }

    const number = Number(value);

    return Number.isFinite(number)
        ? `+${number.toFixed(3)} с`
        : String(value);
}

function scheduleNext(delay) {
    clearTimeout(timer);
    timer = setTimeout(() => loadTiming(), delay);
}

async function loadTiming(manual = false) {
    if (busy) return;

    // Не допускаем повторных запросов во время ограничения API.
    const wait = retryNotBefore - Date.now();

    if (wait > 0) {
        const minutes = Math.ceil(wait / 60000);
        statusText.textContent =
            `Пауза после ошибки API. Попробуй снова примерно через ${minutes} мин.`;
        return;
    }

    busy = true;
    clearTimeout(timer);

    refreshButton.disabled = true;
    refreshButton.textContent = "Загрузка...";
    statusText.classList.remove("error-text");
    statusText.textContent = "Получаем данные OpenF1...";

    try {
        const sessions = await api("sessions?session_key=latest");

        if (!Array.isArray(sessions) || sessions.length === 0) {
            throw new Error("OpenF1 пока не вернул доступных сессий.");
        }

        const session = sessions[sessions.length - 1];
        const key = session.session_key;

        sessionName.textContent =
            `${session.country_name || ""} — ` +
            `${session.session_name || "Сессия"} ` +
            `(${session.year || ""})`;

        const [drivers, positions, laps, intervals] = await Promise.all([
            api(`drivers?session_key=${key}`),
            api(`position?session_key=${key}`),
            api(`laps?session_key=${key}`),
            api(`intervals?session_key=${key}`)
        ]);

        const driverMap = new Map(
            drivers.map(driver => [
                String(driver.driver_number),
                driver
            ])
        );

        const latestPositions = latestByDriver(positions);
        const latestLaps = latestByDriver(laps);
        const latestIntervals = latestByDriver(intervals);

        const ids = new Set([
            ...driverMap.keys(),
            ...latestPositions.keys(),
            ...latestLaps.keys()
        ]);

        const rows = [...ids].map(id => {
            const position = latestPositions.get(id) || {};
            const lap = latestLaps.get(id) || {};
            const interval = latestIntervals.get(id) || {};

            return {
                id,
                driver: driverMap.get(id) || {},
                position: Number(position.position) || 999,
                lapNumber: Number(lap.lap_number) || 0,
                lapTime: lap.lap_duration,
                interval: interval.interval,
                gap: interval.gap_to_leader
            };
        });

        rows.sort((a, b) => a.position - b.position);

        if (!rows.length) {
            table.innerHTML =
                '<tr><td colspan="6">В этой сессии пока нет данных о пилотах.</td></tr>';
        } else {
            table.innerHTML = rows.map(row => {
                const driver = row.driver;

                const name = driver.full_name ||
                    `${driver.first_name || ""} ${driver.last_name || ""}`.trim() ||
                    `Пилот ${row.id}`;

                const team = driver.team_name || "—";

                const colour = /^[0-9a-fA-F]{6}$/.test(driver.team_colour || "")
                    ? `#${driver.team_colour}`
                    : "#e10600";

                const gap = row.position === 1
                    ? "Лидер"
                    : gapString(row.interval ?? row.gap);

                return `
                    <tr>
                        <td><strong>${row.position === 999 ? "—" : row.position}</strong></td>
                        <td>
                            <span class="team-stripe"
                                style="background:${colour}"></span>
                            ${safe(name)}
                            <span style="color:#aaa">#${safe(row.id)}</span>
                        </td>
                        <td>${safe(team)}</td>
                        <td>${row.lapNumber || "—"}</td>
                        <td>${timeString(row.lapTime)}</td>
                        <td>${safe(gap)}</td>
                    </tr>
                `;
            }).join("");
        }

        failures = 0;
        retryNotBefore = 0;

        statusText.textContent =
            "Данные загружены. Автообновление — примерно раз в 2 минуты.";

        updatedAt.textContent =
            "Проверено: " + new Date().toLocaleTimeString("ru-RU");

        scheduleNext(NORMAL_REFRESH_MS);

    } catch (error) {
        console.error(error);

        failures++;

        const backoff = Math.min(
            MAX_BACKOFF_MS,
            120000 * Math.pow(2, failures - 1)
        );

        const delay = Math.max(backoff, error.retryAfterMs || 0);
        retryNotBefore = Date.now() + delay;

        statusText.classList.add("error-text");

        statusText.textContent = error.status === 429
            ? `Лимит запросов OpenF1 (429). Следующая попытка примерно через ${Math.ceil(delay / 60000)} мин.`
            : `${error.message || "Не удалось загрузить данные"}. Повтор примерно через ${Math.ceil(delay / 60000)} мин.`;

        table.innerHTML = `
            <tr>
                <td colspan="6">
                    Данные временно недоступны. Последняя ошибка:
                    ${safe(error.message || "неизвестная ошибка")}.
                    Страница попробует загрузить данные позже.
                </td>
            </tr>
        `;

        scheduleNext(delay);

    } finally {
        busy = false;
        refreshButton.disabled = false;
        refreshButton.textContent = "↻ Обновить";
    }
}

refreshButton.addEventListener("click", () => loadTiming());

loadTiming();
</script>
