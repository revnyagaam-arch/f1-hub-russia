<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reaction Test — F1 Hub Russia</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
  background: #101010;
  color: #fff;
  font-family: Arial, sans-serif;
}

.panel {
  width: min(600px, 100%);
  padding: 28px;
  text-align: center;
  background: linear-gradient(145deg, #1b1b1b, #300000);
  border: 1px solid #e10600;
  border-radius: 14px;
}

.tag {
  color: #e10600;
  letter-spacing: 3px;
  font-size: 12px;
  font-weight: bold;
}

h1 { font-size: clamp(28px, 6vw, 42px); }

p { color: #bbb; line-height: 1.6; }

.lights {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 30px 0;
}

.light {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #350909;
  border: 3px solid #555;
}

.lights.red .light {
  background: #e10600;
  border-color: #ff5555;
  box-shadow: 0 0 15px #e1060080;
}

.lights.green .light {
  background: #00e676;
  border-color: #8affbd;
  box-shadow: 0 0 20px #00e67680;
}

#message {
  min-height: 30px;
  font-weight: bold;
  font-size: 18px;
}

#reaction {
  width: 100%;
  min-height: 100px;
  margin: 15px 0;
  border: 0;
  border-radius: 9px;
  background: #e10600;
  color: white;
  font-size: 21px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}

#reaction.green { background: #00b85a; color: #001b0d; }

.stats {
  line-height: 2;
  margin-top: 15px;
}

a {
  display: inline-block;
  margin-top: 22px;
  color: #bbb;
  text-decoration: none;
}

a:hover { color: white; }
</style>
</head>
<body>
<main class="panel">
  <div class="tag">F1 HUB RUSSIA // CLASSIFIED</div>
  <h1>Проверка реакции</h1>
  <p>Почувствуй себя на стартовой решётке Формулы-1!</p>
  <p>Нажми «НАЧАТЬ», дождись зелёного света и нажми как можно быстрее.</p>

  <div class="lights" id="lights">
    <div class="light"></div>
    <div class="light"></div>
    <div class="light"></div>
    <div class="light"></div>
    <div class="light"></div>
  </div>

  <div id="message" aria-live="polite">Готов к старту?</div>
  <button id="reaction">НАЧАТЬ</button>

  <div class="stats">
    Твоя реакция: <strong id="result">—</strong><br>
    Лучший результат: <strong id="best">—</strong>
  </div>

  <a href="index.html">← Вернуться на главную</a>
</main>

<script>
const lights = document.getElementById("lights");
const button = document.getElementById("reaction");
const message = document.getElementById("message");
const result = document.getElementById("result");
const best = document.getElementById("best");

let state = "idle";
let startTime = 0;
let timer;

function showBest() {
  const saved = localStorage.getItem("f1ReactionBest");
  best.textContent = saved ? saved + " мс" : "—";
}

function startTest() {
  clearTimeout(timer);
  lights.className = "lights";
  result.textContent = "—";
  state = "waiting";
  button.className = "";
  button.textContent = "ЖДИ ЗЕЛЁНОГО!";
  message.textContent = "Внимание…";

  lights.classList.add("red");

  timer = setTimeout(() => {
    if (state !== "waiting") return;
    state = "green";
    lights.className = "lights green";
    button.className = "green";
    button.textContent = "ЖМИ!";
    message.textContent = "СТАРТ!";
    startTime = performance.now();
  }, 2000 + Math.random() * 3000);
}

button.addEventListener("click", () => {
  if (state === "idle" || state === "done" || state === "false") {
    startTest();
  } else if (state === "waiting") {
    clearTimeout(timer);
    state = "false";
    lights.className = "lights";
    button.className = "";
    button.textContent = "ПОПРОБОВАТЬ ЕЩЁ";
    message.textContent = "ФАЛЬСТАРТ! Нажал слишком рано.";
    result.textContent = "Фальстарт";
  } else if (state === "green") {
    const ms = Math.round(performance.now() - startTime);
    state = "done";
    button.className = "";
    button.textContent = "ЕЩЁ ОДИН СТАРТ";
    message.textContent = "Твоя реакция: " + ms + " мс";
    result.textContent = ms + " мс";

    const oldBest = Number(localStorage.getItem("f1ReactionBest"));
    if (!oldBest || ms < oldBest) {
      localStorage.setItem("f1ReactionBest", ms);
      message.textContent += " — НОВЫЙ РЕКОРД!";
    }
    showBest();
  }
});

showBest();
</script>
</body>
</html>
