<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Трассы Формулы-1 | F1 Hub Russia</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .tracks-page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px 20px 60px;
      color: #fff;
    }

    .tracks-heading {
      text-align: center;
      margin-bottom: 28px;
    }

    .tracks-heading h1 {
      font-size: clamp(30px, 5vw, 48px);
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .tracks-heading h1 span {
      color: #e10600;
    }

    .tracks-heading p {
      color: #bdbdbd;
    }

    .tracks-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 25px 0;
    }

    .tracks-controls input,
    .tracks-controls select {
      flex: 1;
      min-width: 190px;
      padding: 13px 15px;
      color: #fff;
      background: #191919;
      border: 1px solid #444;
      border-radius: 8px;
      font-size: 15px;
    }

    .tracks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 18px;
    }

    .track-card {
      display: flex;
      flex-direction: column;
      min-height: 190px;
      padding: 20px;
      background: linear-gradient(145deg, #202020, #111);
      border: 1px solid #383838;
      border-top: 3px solid #e10600;
      border-radius: 10px;
      transition: transform .2s, border-color .2s;
    }

    .track-card:hover {
      transform: translateY(-4px);
      border-color: #e10600;
    }

    .track-number {
      color: #e10600;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .track-card h2 {
      font-size: 20px;
      margin: 12px 0 8px;
    }

    .track-country {
      color: #bdbdbd;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .track-link {
      display: block;
      margin-top: auto;
      padding: 11px 12px;
      text-align: center;
      color: white;
      background: #e10600;
      border-radius: 6px;
      font-weight: bold;
      text-decoration: none;
      transition: background .2s;
    }

    .track-link:hover {
      background: #b90000;
    }

    .tracks-count {
      color: #aaa;
      margin: 0 0 18px;
      font-size: 14px;
    }

    .tracks-back {
      display: inline-block;
      margin-bottom: 20px;
      color: #fff;
      text-decoration: none;
    }

    .tracks-back:hover {
      color: #e10600;
    }

    .no-tracks {
      grid-column: 1 / -1;
      padding: 30px;
      text-align: center;
      color: #bbb;
    }
  </style>
</head>

<body>
  <main class="tracks-page">
    <a class="tracks-back" href="index.html">← На главную</a>

    <header class="tracks-heading">
      <h1>Трассы <span>Формулы-1</span></h1>
      <p>Знаменитые автодромы, городские трассы и легендарные места из истории F1.</p>
    </header>

    <div class="tracks-controls">
      <input
        id="trackSearch"
        type="search"
        placeholder="🔎 Найти трассу или страну..."
        aria-label="Поиск трассы"
      >

      <select id="trackFilter" aria-label="Фильтр трасс">
        <option value="all">Все трассы</option>
        <option value="current">Календарь 2026</option>
        <option value="historic">Исторические трассы</option>
      </select>

      <select id="trackSort" aria-label="Сортировка трасс">
        <option value="default">Стандартный порядок</option>
        <option value="name">По названию</option>
        <option value="country">По стране</option>
      </select>
    </div>

    <p class="tracks-count" id="tracksCount"></p>
    <section class="tracks-grid" id="tracksGrid" aria-label="Каталог трасс"></section>
  </main>

  <script>
    const tracks = [
      // Трассы календаря 2026
      { name: "Albert Park", country: "Австралия · Мельбурн", type: "current", wiki: "Albert Park Grand Prix Circuit" },
      { name: "Shanghai International Circuit", country: "Китай · Шанхай", type: "current", wiki: "Shanghai International Circuit" },
      { name: "Suzuka", country: "Япония · Судзука", type: "current", wiki: "Suzuka International Racing Course" },
      { name: "Miami International Autodrome", country: "США · Майами", type: "current", wiki: "Miami International Autodrome" },
      { name: "Circuit Gilles-Villeneuve", country: "Канада · Монреаль", type: "current", wiki: "Circuit Gilles-Villeneuve" },
      { name: "Circuit de Monaco", country: "Монако · Монте-Карло", type: "current", wiki: "Circuit de Monaco" },
      { name: "Circuit de Barcelona-Catalunya", country: "Испания · Барселона", type: "current", wiki: "Circuit de Barcelona-Catalunya" },
      { name: "Red Bull Ring", country: "Австрия · Шпильберг", type: "current", wiki: "Red Bull Ring" },
      { name: "Silverstone", country: "Великобритания · Сильверстоун", type: "current", wiki: "Silverstone Circuit" },
      { name: "Spa-Francorchamps", country: "Бельгия · Ставло", type: "current", wiki: "Circuit de Spa-Francorchamps" },
      { name: "Hungaroring", country: "Венгрия · Модьород", type: "current", wiki: "Hungaroring" },
      { name: "Zandvoort", country: "Нидерланды · Зандворт", type: "current", wiki: "Circuit Zandvoort" },
      { name: "Monza", country: "Италия · Монца", type: "current", wiki: "Autodromo Nazionale Monza" },
      { name: "Madring", country: "Испания · Мадрид", type: "current", wiki: "Madring" },
      { name: "Baku City Circuit", country: "Азербайджан · Баку", type: "current", wiki: "Baku City Circuit" },
      { name: "Marina Bay", country: "Сингапур", type: "current", wiki: "Marina Bay Street Circuit" },
      { name: "Circuit of the Americas", country: "США · Остин", type: "current", wiki: "Circuit of the Americas" },
      { name: "Hermanos Rodríguez", country: "Мексика · Мехико", type: "current", wiki: "Autódromo Hermanos Rodríguez" },
      { name: "Interlagos", country: "Бразилия · Сан-Паулу", type: "current", wiki: "Autódromo José Carlos Pace" },
      { name: "Las Vegas Strip Circuit", country: "США · Лас-Вегас", type: "current", wiki: "Las Vegas Strip Circuit" },
      { name: "Lusail International Circuit", country: "Катар · Лусаил", type: "current", wiki: "Lusail International Circuit" },
      { name: "Yas Marina", country: "ОАЭ · Абу-Даби", type: "current", wiki: "Yas Marina Circuit" },

      // Исторические и другие трассы F1
      { name: "Imola", country: "Италия · Имола", type: "historic", wiki: "Imola Circuit" },
      { name: "Hockenheimring", country: "Германия · Хоккенхайм", type: "historic", wiki: "Hockenheimring" },
      { name: "Nürburgring", country: "Германия · Нюрбург", type: "historic", wiki: "Nürburgring" },
      { name: "Sepang International Circuit", country: "Малайзия · Сепанг", type: "historic", wiki: "Sepang International Circuit" },
      { name: "Istanbul Park", country: "Турция · Стамбул", type: "historic", wiki: "Istanbul Park" },
      { name: "Circuit Paul Ricard", country: "Франция · Ле-Кастелле", type: "historic", wiki: "Circuit Paul Ricard" },
      { name: "Magny-Cours", country: "Франция · Невер", type: "historic", wiki: "Circuit de Nevers Magny-Cours" },
      { name: "Jerez", country: "Испания · Херес", type: "historic", wiki: "Circuito de Jerez" },
      { name: "Valencia Street Circuit", country: "Испания · Валенсия", type: "historic", wiki: "Valencia Street Circuit" },
      { name: "Adelaide Street Circuit", country: "Австралия · Аделаида", type: "historic", wiki: "Adelaide Street Circuit" },
      { name: "Fuji Speedway", country: "Япония · Фудзи", type: "historic", wiki: "Fuji Speedway" },
      { name: "Indianapolis Motor Speedway", country: "США · Индианаполис", type: "historic", wiki: "Indianapolis Motor Speedway" },
      { name: "Watkins Glen", country: "США · Уоткинс-Глен", type: "historic", wiki: "Watkins Glen International" },
      { name: "Long Beach", country: "США · Лонг-Бич", type: "historic", wiki: "Long Beach street circuit" },
      { name: "Detroit Street Circuit", country: "США · Детройт", type: "historic", wiki: "Detroit street circuit" },
      { name: "Phoenix Street Circuit", country: "США · Финикс", type: "historic", wiki: "Phoenix street circuit" },
      { name: "Kyalami", country: "ЮАР · Мидранд", type: "historic", wiki: "Kyalami" },
      { name: "Brands Hatch", country: "Великобритания · Кент", type: "historic", wiki: "Brands Hatch" },
      { name: "Donington Park", country: "Великобритания · Лестершир", type: "historic", wiki: "Donington Park" },
      { name: "Aintree", country: "Великобритания · Ливерпуль", type: "historic", wiki: "Aintree Motor Racing Circuit" },
      { name: "Rouen-Les-Essarts", country: "Франция · Руан", type: "historic", wiki: "Rouen-Les-Essarts" },
      { name: "Dijon-Prenois", country: "Франция · Дижон", type: "historic", wiki: "Dijon-Prenois" },
      { name: "Zolder", country: "Бельгия · Зольдер", type: "historic", wiki: "Circuit Zolder" },
      { name: "Montjuïc", country: "Испания · Барселона", type: "historic", wiki: "Montjuïc circuit" },
      { name: "Buddh International Circuit", country: "Индия · Большая Нойда", type: "historic", wiki: "Buddh International Circuit" },
      { name: "Korean International Circuit", country: "Южная Корея · Ёнам", type: "historic", wiki: "Korean International Circuit" },
      { name: "Sochi Autodrom", country: "Россия · Сочи", type: "historic", wiki: "Sochi Autodrom" },
      { name: "Bahrain International Circuit", country: "Бахрейн · Сахир", type: "historic", wiki: "Bahrain International Circuit" },
      { name: "Jeddah Corniche Circuit", country: "Саудовская Аравия · Джидда", type: "historic", wiki: "Jeddah Corniche Circuit" },
      { name: "Portimão", country: "Португалия · Алгарве", type: "historic", wiki: "Algarve International Circuit" },
      { name: "Estoril", country: "Португалия · Эшторил", type: "historic", wiki: "Circuito do Estoril" },
      { name: "Jacarepaguá", country: "Бразилия · Рио-де-Жанейро", type: "historic", wiki: "Autódromo Internacional Nelson Piquet" },
      { name: "Buenos Aires", country: "Аргентина · Буэнос-Айрес", type: "historic", wiki: "Autódromo Oscar y Juan Gálvez" },
      { name: "AVUS", country: "Германия · Берлин", type: "historic", wiki: "AVUS" },
      { name: "Bremgarten", country: "Швейцария · Берн", type: "historic", wiki: "Circuit Bremgarten" },
      { name: "Pescara Circuit", country: "Италия · Пескара", type: "historic", wiki: "Pescara Circuit" },
      { name: "Reims-Gueux", country: "Франция · Реймс", type: "historic", wiki: "Reims-Gueux" },
      { name: "Charade Circuit", country: "Франция · Клермон-Ферран", type: "historic", wiki: "Charade Circuit" },
      { name: "Baku — исторический поиск", country: "Азербайджан", type: "historic", wiki: "Azerbaijan Grand Prix" }
    ];

    const grid = document.getElementById("tracksGrid");
    const search = document.getElementById("trackSearch");
    const filter = document.getElementById("trackFilter");
    const sort = document.getElementById("trackSort");
    const count = document.getElementById("tracksCount");

    function wikipediaSearch(title) {
      return "https://ru.wikipedia.org/w/index.php?search=" +
        encodeURIComponent(title) +
        "&title=Служебная:Поиск&fulltext=1";
    }

    function renderTracks() {
      const query = search.value.trim().toLowerCase();

      let shown = tracks.filter(track => {
        const matchesSearch =
          track.name.toLowerCase().includes(query) ||
          track.country.toLowerCase().includes(query);

        const matchesFilter =
          filter.value === "all" || track.type === filter.value;

        return matchesSearch && matchesFilter;
      });

      if (sort.value === "name") {
        shown.sort((a, b) => a.name.localeCompare(b.name, "ru"));
      } else if (sort.value === "country") {
        shown.sort((a, b) => a.country.localeCompare(b.country, "ru"));
      }

      count.textContent = `Найдено трасс: ${shown.length}`;

      if (shown.length === 0) {
        grid.innerHTML = '<div class="no-tracks">Ничего не найдено. Попробуй другое название.</div>';
        return;
      }

      grid.innerHTML = shown.map((track, index) => {
        const category = track.type === "current"
          ? "КАЛЕНДАРЬ 2026"
          : "ИСТОРИЯ F1";

        const url = wikipediaSearch(track.wiki);

        return `
          <article class="track-card">
            <div class="track-number">${category} · ${String(index + 1).padStart(2, "0")}</div>
            <h2>${track.name}</h2>
            <div class="track-country">${track.country}</div>
            <a class="track-link"
               href="${url}"
               target="_blank"
               rel="noopener noreferrer">
              Читать в Википедии ↗
            </a>
          </article>
        `;
      }).join("");
    }

    search.addEventListener("input", renderTracks);
    filter.addEventListener("change", renderTracks);
    sort.addEventListener("change", renderTracks);

    renderTracks();
  </script>
</body>
</html>
